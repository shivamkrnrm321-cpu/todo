<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background-image: url("todoo image.jpeg");
    background-size: cover;
    animation: gradient 10s ease infinite;
    }

    @keyframes gradient {
         0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
   }

.container{
    width:90%;
    max-width:450px;
    background:#cb1414;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.input-box{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#f0f0f0;
    font-size:16px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#667eea;
    color:white;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    background:#5568d8;
}

ul{
    margin-top:20px;
}

li{
    list-style:none;
    background:#f7f7f7;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    animation:slide .3s ease;
}

@keyframes slide{
    from{
        opacity:0;
        transform:translateY(-10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.completed{
    text-decoration:line-through;
    color:gray;
}

.task{
    cursor:pointer;
    flex:1;
}

.delete{
    background:rgb(30, 107, 9);
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
}

.delete:hover{
    background:darkred;
}
</style>
</head>
<body>


<div class="container">
    <h1>📝 To-Do App</h1>

    <div class="input-box">
        <input type="text" id="taskInput" placeholder="Add Here Somthings...">
        <button onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>
</div>

<script>
const taskInput = document.getElementById("taskInput");
const taskList = document.getElementById("taskList");

loadTasks();

function addTask(){
    if(taskInput.value.trim() === ""){
        alert("Please Enter Something!!");
        return;
    }

    createTask(taskInput.value,false);
    saveTasks();
    taskInput.value="";
}

function createTask(text,completed){
    const li = document.createElement("li");

    const span = document.createElement("span");
    span.classList.add("task");
    span.innerText = text;

    if(completed){
        span.classList.add("completed");
    }

    span.onclick = () =>{
        span.classList.toggle("completed");
        saveTasks();
    };

    const delBtn = document.createElement("button");
    delBtn.innerText="Remove";
    delBtn.classList.add("delete");

    delBtn.onclick = () =>{
        li.remove();
        saveTasks();
    };

    li.appendChild(span);
    li.appendChild(delBtn);

    taskList.appendChild(li);
}

function saveTasks(){
    let tasks = [];

    document.querySelectorAll("#taskList li").forEach(li=>{
        tasks.push({
            text: li.querySelector(".task").innerText,
            completed: li.querySelector(".task").classList.contains("completed")
        });
    });

    localStorage.setItem("tasks",JSON.stringify(tasks));
}

function loadTasks(){
    const tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    tasks.forEach(task=>{
        createTask(task.text,task.completed);
    });
}

taskInput.addEventListener("keypress",function(e){
    if(e.key==="Enter"){
        addTask();
    }
});
</script>

</body>
</html>
